name: deploy

# Backend merge → dev (P2-T08); never wakes the env (ADR-0013). awake: migrate, roll out, smoke;
# asleep: the same without smoke; hibernated: push and register only (resume verifies, P2-T09).
on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".trivyignore.yaml"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/describe-env.sh"
      - ".github/scripts/wait-for-health.sh"
  workflow_dispatch: # re-deploy (aws-deploy allows master only)

permissions: {}

env:
  ENVIRONMENT: dev
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devcool # bootstrap/ecr.tf

jobs:
  deploy:
    name: Build, migrate, roll out
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-deploy # gha-deploy trusts it from this file on master only (bootstrap/oidc.tf)
    # One change to dev at a time (shared with infra-apply, env-power); re-run cancelled runs.
    concurrency:
      group: aws-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AWS credentials (gha-deploy, OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable: a re-run reuses the image already pushed and scanned.
      - name: Check for an existing image
        id: image_check
        run: |
          echo "ref=${{ steps.ecr_login.outputs.registry }}/$ECR_REPOSITORY:$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "::notice:::$GITHUB_SHA is already in ECR; skipping build and push"
          fi

      - name: Set up Docker Buildx
        if: steps.image_check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No attestations: they eat ECR's "keep 20" and can take the tag (bootstrap review #9).
      - name: Build the image
        if: steps.image_check.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: ${{ steps.image_check.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same gate as ci-docker.yml.
      - name: Trivy image (gate, fixable HIGH and CRITICAL, OS + libraries)
        if: steps.image_check.outputs.exists != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.image_check.outputs.ref }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      - name: Push :${{ github.sha }}
        if: steps.image_check.outputs.exists != 'true'
        run: docker push "${{ steps.image_check.outputs.ref }}"

      - name: Environment state
        id: env_state
        run: .github/scripts/describe-env.sh

      # On failure, newer revisions are deregistered, so the last ACTIVE one stays the running one.
      - name: Remember the latest revision
        id: previous_revision
        run: |
          revision_arn=$(aws ecs describe-task-definition \
            --task-definition "${{ steps.env_state.outputs.family }}" \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$revision_arn" >>"$GITHUB_OUTPUT"

      # Keeps Terraform's config from the latest revision; only the image changes.
      - name: Render the task definition
        id: task_def
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: ${{ steps.env_state.outputs.family }}
          container-name: ${{ steps.env_state.outputs.container }}
          image: ${{ steps.image_check.outputs.ref }}

      - name: Register only (hibernated)
        if: steps.env_state.outputs.state == 'hibernated'
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.task_def.outputs.task-definition }}

      # Register → migrate task (a failure stops before the service changes) → roll out → wait.
      - name: Register, migrate, roll out
        if: steps.env_state.outputs.state != 'hibernated'
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.task_def.outputs.task-definition }}
          cluster: ${{ steps.env_state.outputs.cluster_name }}
          service: ${{ steps.env_state.outputs.api_service_name }}
          run-task: true
          run-task-launch-type: FARGATE
          run-task-subnets: ${{ steps.env_state.outputs.api_subnet_ids }}
          run-task-security-groups: ${{ steps.env_state.outputs.api_security_group_ids }}
          run-task-assign-public-IP: DISABLED
          run-task-started-by: deploy-migrate
          run-task-container-overrides: >-
            [{"name": "${{ steps.env_state.outputs.container }}",
              "environment": [{"name": "SPRING_PROFILES_ACTIVE", "value": "ecs,migrate"}]}]
          wait-for-task-stopped: true
          wait-for-service-stability: true
          wait-for-minutes: 30

      - name: Deregister the failed revision
        if: failure() && steps.previous_revision.outputs.arn != ''
        run: |
          latest_revision=$(aws ecs describe-task-definition \
            --task-definition "${{ steps.env_state.outputs.family }}" \
            --query taskDefinition.taskDefinitionArn --output text)
          if [ "$latest_revision" != "${{ steps.previous_revision.outputs.arn }}" ]; then
            aws ecs deregister-task-definition --task-definition "$latest_revision" >/dev/null
            echo "::warning::Deregistered $latest_revision; the running revision is unchanged"
          fi

      - name: Smoke test /actuator/health
        if: steps.env_state.outputs.state == 'awake'
        run: .github/scripts/wait-for-health.sh "${{ steps.env_state.outputs.domain }}" 200

      - name: Summary
        if: always()
        run: |
          case "${{ job.status }}:${{ steps.env_state.outputs.state }}" in
            success:awake)      summary="Deployed and smoke-tested." ;;
            success:asleep)     summary="Migrated and rolled out at 0 tasks. Smoke test skipped: the env is asleep (it runs on wake, P2-T09)." ;;
            success:hibernated) summary="Image pushed and revision registered. Nothing woke. **Verify on resume** (P2-T09: migrate → rollout → smoke)." ;;
            *)                  summary="Failed (${{ job.status }}). A new revision is deregistered; the running one is unchanged." ;;
          esac
          {
            echo "### deploy :\`${GITHUB_SHA::7}\` → ${ENVIRONMENT} (${{ steps.env_state.outputs.state || 'unknown' }})"
            echo "$summary"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.env_state.outputs.state }}" = "asleep" ]; then echo "::notice::$summary"; fi
