name: ci-workflows

# Reusable (called by ci.yml when workflows or scripts changed), issue #155.
# One pinned image for both tools: actionlint bundles shellcheck and runs it on every `run:` block.
# Accepted findings use an inline `# shellcheck disable=SCxxxx` with a one-line reason.
on:
  workflow_call:

env:
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # shellcheck 0.11.0

jobs:
  lint:
    name: actionlint, shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (workflows and their run blocks)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: shellcheck (.github/scripts)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo --entrypoint shellcheck "$ACTIONLINT_IMAGE" .github/scripts/*.sh
