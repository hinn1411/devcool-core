# Temporary (P2-T01): proves the gha-* trust policies, then gets deleted.
# PR: gha-plan works, gha-deploy is refused (no environment → wrong `sub`).
# master: a job in the aws-deploy environment assumes gha-deploy.
name: oidc-test

on:
  pull_request:
    paths: [".github/workflows/oidc-test.yml"]
  push:
    branches: [master]
    paths: [".github/workflows/oidc-test.yml"]

permissions: {}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request its OIDC token
    steps:
      - name: Assume gha-plan
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: gha-plan identity
        run: aws sts get-caller-identity

      - name: Assume gha-deploy (must fail)
        id: deploy
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fail if gha-deploy was assumed
        if: steps.deploy.outcome != 'failure'
        run: |
          echo "::error::A pull_request job assumed gha-deploy; its trust policy is too wide."
          exit 1

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: aws-deploy # makes the token's sub `repo:…:environment:aws-deploy`
    permissions:
      id-token: write
    steps:
      - name: Assume gha-deploy
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: gha-deploy identity
        run: aws sts get-caller-identity
