name: ci-changes

# Reusable (called by ci.yml): decides which CI areas a push or PR changed.
on:
  workflow_call:
    outputs:
      backend:
        description: "'true' when backend files changed"
        value: ${{ jobs.filter.outputs.backend }}
      infra:
        description: "'true' when infra files changed"
        value: ${{ jobs.filter.outputs.infra }}
      docker:
        description: "'true' when the production image's inputs changed"
        value: ${{ jobs.filter.outputs.docker }}

jobs:
  filter:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # Pushes are diffed with git (against the previous commit), so they need the repo.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `docker` covers the image's build inputs (the .dockerignore allow-list) except src/**:
          # `backend` already compiles and packages src, so a src-only change rarely breaks the
          # image, and the rare break shows up at deploy. docker/** stays out: the image doesn't
          # use it, and the Testcontainers ITs don't read docker/local.
          # Each list includes the workflows that run it, so editing a workflow runs it.
          filters: |
            backend:
              - 'src/**'
              - 'pom.xml'
              - 'mvnw*'
              - '.mvn/**'
              - 'spotbugs-exclude.xml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-changes.yml'
              - '.github/workflows/ci-backend.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-changes.yml'
              - '.github/workflows/ci-infra.yml'
              - '.github/workflows/infra-plan.yml'
              - '.github/scripts/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - '.trivyignore.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-changes.yml'
              - '.github/workflows/ci-docker.yml'
