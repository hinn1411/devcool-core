name: Claude Code

on:
  pull_request:
    # Opt-in via the `claude-review` label (saves usage)
    types: [labeled]
    # No review for docs-only PRs; @claude still works
    paths-ignore: ['docs/**']
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude-auto-review:
    if: |
      github.event_name == 'pull_request' && github.event.label.name == 'claude-review' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auto-review PR
        uses: anthropics/claude-code-action@v1.0.70
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Headless: unlisted tools are denied, so posting needs explicit tools
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are pre-reviewing this pull request before a human does. The PR branch is
            checked out in the working directory. Review only; don't edit files or push.
            Read files with the Read, Grep and Glob tools. Bash is only allowed for `gh pr diff`
            and `gh pr view`; any other command is denied.

            1. List the changed files with `gh pr diff --name-only`, then read the diff.
            2. Review checklist, by changed path. Read these files; don't review from memory:
               - Always: the "PR Review Guidelines" section of `CLAUDE.md`.
               - Every `.claude/rules/*.md` whose `paths:` frontmatter matches a changed file.
               - `frontend/**` → `frontend/CLAUDE.md`; `infra/**` → `infra/CLAUDE.md`.
               - Security-sensitive paths (`infra/**`, `**/auth/**`, `**/jwt/**`, `**/security/**`,
                 `**/crypto/**`, `**/websocket/**`, `.github/workflows/**`): also use the checks in
                 `.claude/agents/security-reviewer.md`.
            3. Also look for correctness bugs and missing tests for new behaviour (comment a
               missing test on the declaration line of the untested class or method).
            4. Post each concrete issue as an inline comment on the line with
               `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`). Name the
               rule it breaks (e.g. "CLAUDE.md: Authorization" or "hexagonal.md") and suggest a fix.
            Post inline comments only; no summary comment. Skip style nits that Spotless or
            Checkstyle already enforce.

  claude-on-demand:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1.0.70
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
