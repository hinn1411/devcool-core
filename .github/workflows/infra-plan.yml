name: infra-plan

# Reusable, called by ci.yml on infra PRs. Plans each changed stack as gha-plan (read-only) for the
# env's power state, like infra-apply, and keeps one PR comment per stack.
on:
  workflow_call:
    secrets:
      BUDGET_ALERT_EMAILS:
        required: false # bootstrap only: its plan fails without it

env:
  ENVIRONMENT: dev
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  stacks:
    name: Changed stacks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.changed_stacks.outputs.stacks }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Map changed paths to stacks
        id: changed_stacks
        run: |
          stacks=$(.github/scripts/list-stacks.sh plan \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "Stacks: $stacks"
          echo "stacks=$stacks" >>"$GITHUB_OUTPUT"

  plan:
    name: Plan (${{ matrix.stack }})
    needs: stacks
    if: needs.stacks.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write # the plan comment
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.stacks) }}
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_VAR_budget_alert_emails: ${{ secrets.BUDGET_ALERT_EMAILS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tf-providers-${{ hashFiles('infra/**/.terraform.lock.hcl') }}

      - name: Create the provider cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: AWS credentials (gha-plan, OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Environment state
        id: env_state
        run: .github/scripts/describe-env.sh

      - name: terraform plan
        id: plan
        env:
          STATE: ${{ steps.env_state.outputs.state }}
          IMAGE_TAG: ${{ steps.env_state.outputs.image_tag }}
        run: .github/scripts/terraform-stack.sh plan "${{ matrix.stack }}"

      - name: Post the plan comment
        if: always() && steps.env_state.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.env_state.outputs.state }}
          OUTCOME: ${{ steps.plan.outcome }}
          CHANGES: ${{ steps.plan.outputs.changes }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/upsert-plan-comment.sh "${{ matrix.stack }}"
