name: infra-apply

# Infra merge → dev: apply all stacks (a cancelled run loses nothing), never waking it (ADR-0013).
# Bootstrap: by hand.
on:
  push:
    branches: ["master"]
    paths:
      - "infra/**"
      - ".github/workflows/infra-apply.yml"
      - ".github/scripts/**"
      - ".github/actions/setup-terraform/**"
  workflow_dispatch: # e.g. after a cancelled run

permissions: {}

env:
  ENVIRONMENT: dev
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  stacks:
    name: Stacks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.stack_list.outputs.stacks }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: List the stacks in apply order
        id: stack_list
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Only for its bootstrap warning.
            .github/scripts/list-stacks.sh apply "${{ github.event.before }}" "$GITHUB_SHA" >/dev/null
          fi
          stacks=$(.github/scripts/list-stacks.sh apply all)
          echo "Stacks: $stacks"
          echo "stacks=$stacks" >>"$GITHUB_OUTPUT"

  apply:
    name: Apply
    needs: stacks
    if: needs.stacks.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-deploy # gha-deploy trusts this file on master (oidc.tf)
    concurrency:
      group: aws-dev # shared with deploy and env-power
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      STACKS: ${{ needs.stacks.outputs.stacks }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: AWS credentials (gha-deploy, OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Read once: aws-dev keeps env-power out mid-run.
      - name: Environment state
        id: env_state
        run: .github/scripts/describe-env.sh

      - name: Apply the stacks in order
        env:
          STATE: ${{ steps.env_state.outputs.state }}
          IMAGE_TAG: ${{ steps.env_state.outputs.image_tag }}
        run: |
          for stack in $(jq -r '.[]' <<<"$STACKS"); do
            echo "::group::$stack ($STATE)"
            if [ "$stack" = "app" ] && [ "$STATE" = "hibernated" ]; then
              echo "::notice::app skipped: the env is hibernated; resume (P2-T09) applies it"
              echo "- \`app\`: skipped (hibernated)" >>"$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi
            .github/scripts/terraform-stack.sh apply "$stack"
            echo "- \`$stack\`: applied" >>"$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      # A new app revision goes live only when the service points at it.
      - name: Roll the api service onto the latest revision
        if: contains(fromJSON(needs.stacks.outputs.stacks), 'app') && steps.env_state.outputs.state != 'hibernated'
        run: |
          # Re-read: the app apply may have re-created them.
          read_app_param() { aws ssm get-parameter --name "/devcool/$ENVIRONMENT/app/$1" --query Parameter.Value --output text; }
          .github/scripts/roll-service-to-latest.sh "$(read_app_param cluster_name)" "$(read_app_param api_service_name)" "${{ steps.env_state.outputs.family }}"
