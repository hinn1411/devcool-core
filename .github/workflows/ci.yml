name: ci

on:
  pull_request:
  push:
    branches: [ "master" ]

jobs:
  build-test:
    name: Build, Test, Coverage, (Sonar if token)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Keep outputs consistent
      MAVEN_OPTS: -Duser.language=en -Duser.region=US -Dfile.encoding=UTF-8
      # Job level, so a step `if:` can see it (a step's own env is applied after its `if:`)
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Maven Wrapper
        run: ./mvnw -v

      - name: Cache sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Formatting check
        run: ./mvnw -B spotless:check

      # One build, every gate: unit tests, ITs (Testcontainers, fails on 0 ITs),
      # JaCoCo line-coverage floor, SpotBugs (EI baseline in spotbugs-exclude.xml).
      - name: Build + unit tests + ITs + coverage + SpotBugs
        run: ./mvnw -B -U -Dit -Pstatic-analysis verify

      # Reuses target/ from the step above: no second compile or test run.
      - name: Sonar analysis
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        run: ./mvnw -B sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.projectKey=hinn1411_devcool-core

      - name: Upload surefire & failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/**"
