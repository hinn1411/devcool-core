name: ci

on:
  pull_request:
  push:
    branches: [ "master" ]

# Router: `changes` picks the areas; each area job runs .github/actions/ci-<area>.
# A skipped job never reports, so `ci-gate` is the only required check (PR #130).
permissions: {}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      # Pushes are diffed with git, so they need the repo.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # docker = the image's inputs minus src/** (backend builds it) and docker/** (unused).
          # Each list includes ci.yml and its action, so editing them runs the area.
          filters: |
            backend:
              - 'src/**'
              - 'pom.xml'
              - 'mvnw*'
              - '.mvn/**'
              - 'spotbugs-exclude.xml'
              - '.github/workflows/ci.yml'
              - '.github/actions/ci-backend/**'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/infra-plan.yml'
              - '.github/actions/ci-infra/**'
              - '.github/actions/setup-terraform/**'
              - '.github/scripts/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - '.trivyignore.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/ci-docker/**'
              - '.github/scripts/check-image.sh'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'

  backend:
    name: Build, Test, Coverage, Sonar
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Duser.language=en -Duser.region=US -Dfile.encoding=UTF-8
      # The only secret; fork and Dependabot PRs get none, so Sonar fails there.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-backend

  infra:
    name: Terraform fmt, validate, tflint, Trivy
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/ci-infra

  docker:
    name: Build, lint and scan image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/ci-docker

  workflows:
    name: actionlint, shellcheck
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-workflows

  # Same-repo PRs only (no OIDC for forks). Stays a workflow: gha-plan trusts it by file name.
  infra-plan:
    needs: changes
    if: |
      github.event_name == 'pull_request' && needs.changes.outputs.infra == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/infra-plan.yml
    permissions:
      contents: read
      id-token: write # gha-plan via OIDC
      pull-requests: write # the plan comments
    secrets:
      BUDGET_ALERT_EMAILS: ${{ secrets.BUDGET_ALERT_EMAILS }}

  # Skipped jobs pass; a failed or cancelled one fails. Add every new job to `needs`.
  ci-gate:
    needs: [changes, backend, infra, docker, workflows, infra-plan]
    if: always() # else a skipped need skips the gate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the results of every CI job
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::A required CI job failed or was cancelled."
            exit 1
          fi
