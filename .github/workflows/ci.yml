name: ci

on:
  pull_request:
  push:
    branches: [ "master" ]

# Router: `changes` decides which areas changed, and each area's checks live in a reusable
# workflow (ci-*.yml). A job skipped by `if:` still reports a (passing) check, so it can be
# required; a workflow skipped by `on.paths` would leave the check pending forever.
# Check names look like `<job here> / <job name in the called workflow>`.
permissions: {}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # only this one, not `secrets: inherit`

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/ci-infra.yml
    permissions:
      contents: read
