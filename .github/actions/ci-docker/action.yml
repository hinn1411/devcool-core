name: ci-docker
description: Build the production image without pushing it, check what the Dockerfile promises, scan it. Called by ci.yml when the image's inputs changed.
# deploy.yml pushes (P2-T08). Background: docs/learning/18-docker-and-ecs.md.

inputs:
  image:
    description: Local tag for the built image
    default: devcool:ci

runs:
  using: composite
  steps:
    - name: hadolint
      uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      with:
        dockerfile: Dockerfile

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # `mode=max` also caches the build stage, so the dependency layer survives between runs.
    - name: Build the image (no push)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: ${{ inputs.image }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check non-root user, heap sizing and Boot layers
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: .github/scripts/check-image.sh "$IMAGE"

    # Report first (never fails, no ignores), then the gate: fixable HIGH/CRITICAL in OS and
    # libraries, minus the accepted findings in .trivyignore.yaml.
    - name: Trivy image (report, HIGH and CRITICAL, OS + libraries)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.70.0
        scan-type: image
        image-ref: ${{ inputs.image }}
        severity: HIGH,CRITICAL
        exit-code: "0"

    - name: Trivy image (gate, fixable HIGH and CRITICAL, OS + libraries)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.70.0
        skip-setup-trivy: true
        scan-type: image
        image-ref: ${{ inputs.image }}
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        trivyignores: .trivyignore.yaml
        exit-code: "1"
