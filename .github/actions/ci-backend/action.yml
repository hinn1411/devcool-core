name: ci-backend
description: Format check, one Maven build with every gate, Sonar, reports. Called by ci.yml when backend paths changed.
# The calling job checks out with fetch-depth 0 (Sonar blame) and sets MAVEN_OPTS and SONAR_TOKEN:
# a composite action can't read secrets.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: maven

    - name: Validate Maven Wrapper
      shell: bash
      run: ./mvnw -v

    - name: Cache sonar packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Formatting check
      shell: bash
      run: ./mvnw -B spotless:check

    # One build, every gate: unit tests, ITs (Testcontainers, fails on 0 ITs),
    # JaCoCo line-coverage floor, SpotBugs (EI baseline in spotbugs-exclude.xml).
    - name: Build + unit tests + ITs + coverage + SpotBugs
      shell: bash
      run: ./mvnw -B -U -Dit -Pstatic-analysis verify

    # Reuses target/ from the step above: no second compile or test run.
    # Fork and Dependabot PRs get no SONAR_TOKEN, so this fails there.
    - name: Sonar analysis
      shell: bash
      run: ./mvnw -B sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.projectKey=hinn1411_devcool-core

    - name: Upload surefire & failsafe reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          **/target/surefire-reports/**
          **/target/failsafe-reports/**

    - name: Upload JaCoCo HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: "**/target/site/jacoco/**"
