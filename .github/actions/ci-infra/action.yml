name: ci-infra
description: Terraform fmt, validate, tflint, Trivy config. Called by ci.yml when infra paths changed.
# Static checks only: no AWS credentials and no backend (`init -backend=false`).
# `terraform plan` needs OIDC and comes with infra-plan.yml (P2-T08).

runs:
  using: composite
  steps:
    - name: Set up Terraform
      uses: ./.github/actions/setup-terraform

    - name: terraform fmt
      shell: bash
      run: terraform fmt -check -recursive -diff infra

    - name: terraform validate (every stack and module)
      shell: bash
      run: .github/scripts/validate-stacks.sh

    - name: Set up TFLint
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: v0.64.0
        cache: true
        tflint_config_path: infra/.tflint.hcl

    - name: tflint
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }} # plugin downloads hit the GitHub API rate limit without it
      run: |
        tflint --chdir infra --init
        tflint --chdir infra --recursive --config "$GITHUB_WORKSPACE/infra/.tflint.hcl" --format compact

    # Full report first (never fails), then the gate. Accepted findings are suppressed
    # inline with `#trivy:ignore:<id>` and a reason next to the resource.
    - name: Trivy config (report, all severities)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.70.0
        scan-type: config
        scan-ref: infra
        exit-code: "0"

    - name: Trivy config (gate, HIGH and CRITICAL)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.70.0
        skip-setup-trivy: true
        scan-type: config
        scan-ref: infra
        severity: HIGH,CRITICAL
        exit-code: "1"
