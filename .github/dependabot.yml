version: 2
updates:
  # Bumps the digest-pinned base images in the root Dockerfile (P2-T06), so the pins don't go
  # stale with unpatched CVEs. GitHub Actions updates aren't configured yet.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Backend dependencies (P2-T14). One grouped PR a week for minor and patch updates, so the
  # image's library CVEs (ci-docker.yml gate) don't pile up between bumps. Boot parent majors
  # are ignored: Boot 4 / Framework 7 needs its own task and ADR.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types:
          - version-update:semver-major
