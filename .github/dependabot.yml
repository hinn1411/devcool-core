version: 2
updates:
  # Bumps the digest-pinned Dockerfile bases (P2-T06). GitHub Actions isn't configured yet.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Backend deps (P2-T14): one grouped minor/patch PR a week. Boot majors need their own ADR.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types:
          - version-update:semver-major
