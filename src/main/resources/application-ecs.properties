# ECS datasource, set by the task definition (P2-T04): URL as plain env (Aurora endpoint),
# USERNAME/PASSWORD as `secrets` from the RDS-managed secret's username/password keys.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Room for Aurora to resume from 0 ACU. Milliseconds: Hikari doesn't accept "60s".
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:60000}

# ECS JPA: don't destroy schema
spring.jpa.hibernate.ddl-auto=validate

# ECS Flyway: off in the app; the `ecs,migrate` task runs it before each deploy.
spring.flyway.enabled=false

# Bucket per env (set from task env if you want)
aws.s3.bucket=${AWS_S3_BUCKET:devcool-media}

# One ECS JSON object per log line, MDC entries as fields (P1-T15, ADR-0008).
# Debug SQL: set LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG on the task, briefly.
logging.structured.format.console=ecs
