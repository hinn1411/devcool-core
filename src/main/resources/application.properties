# Common
spring.application.name=devcool

# JPA (common defaults). Flyway owns the schema (db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate

# Virtual threads (P1-T16): Tomcat (HTTP + WS frames), @Async and schedulers. A blocked call
# unmounts instead of holding one of 200 platform threads. On Java 21, never block inside
# `synchronized` (pins the carrier); WsVirtualThreadsIT guards the WS send path.
spring.threads.virtual.enabled=true

# Docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# AWS (common; override per env if needed)
aws.region=ap-southeast-1

# Security (common: secrets come from env in all envs)
security.jwt.access-secret=${JWT_ACCESS_SECRET}
security.jwt.refresh-secret=${JWT_REFRESH_SECRET}

# Health probes (P1-T10). Only `health` is exposed. The liveness/readiness groups keep Spring's
# defaults: never add db/redis to them, because on ECS a failing ALB check replaces the task
# (docs/learning/14-health-checks-and-graceful-shutdown.md §3-4).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Graceful shutdown: on SIGTERM, refuse new requests and give in-flight ones up to 30 s.
# ECS stopTimeout must stay above this (P2).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
