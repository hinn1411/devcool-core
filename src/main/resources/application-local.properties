# Local: let Spring Boot start docker compose dependencies when you run app from IntelliJ
spring.docker.compose.lifecycle-management=start_only
spring.docker.compose.file=./docker/local/compose.yaml

# Local datasource: no url, username or password here. Spring Boot reads them from the running
# compose service (its service-connection label); the values live in docker/local/.env.

# Local bucket
aws.s3.bucket=devcool-media-local

# SQL via the logger; show-sql prints to System.out and bypasses log levels.
logging.level.org.hibernate.SQL=DEBUG
