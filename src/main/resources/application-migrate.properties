# One-off migrate task (P2-T05): SPRING_PROFILES_ACTIVE=ecs,migrate, run before each deploy (P2-T08).
# Migrates, validates, then exits: 0 on success, 1 on failure.
spring.main.web-application-type=none
spring.flyway.enabled=true
# A cold Aurora resume (0 ACU, long pause) can outlast pgjdbc's 60 s connect timeout: retry
# instead of failing the deploy (P2-T04 smoke, 2026-10-20). Backoff 1 s, 2 s, 4 s.
spring.flyway.connect-retries=3
