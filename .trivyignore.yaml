# Accepted findings for the image gate (ci-docker.yml), passed with `trivyignores`.
# Each entry needs a statement and an expiry: when it lapses, the gate fails again and the
# finding is re-checked (P2-T14). Only add CVEs that have no fix on our Boot line.
vulnerabilities:
  # Fixed only in Spring Framework 7.0.9 (Boot 4); 6.2.x has no patch.
  - id: CVE-2026-47884
    statement: >-
      XsltView RCE/SSRF. Not reachable: the app has no XsltView, no view resolvers or
      template engine, only @RestController JSON endpoints. Re-check on Boot 4 / Framework 7.
    expired_at: 2027-01-18
  - id: CVE-2026-47890
    statement: >-
      SSE stream corruption with view fragments. Not reachable: no SseEmitter, no
      text/event-stream endpoints, no view fragments. Re-check on Boot 4 / Framework 7.
    expired_at: 2027-01-18
