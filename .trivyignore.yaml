    statement: >-
      XsltView RCE. Not reachable: no XsltView or view resolvers, JSON endpoints only.
    expired_at: 2027-01-18
  - id: CVE-2026-47890
    statement: >-
      SSE view-fragment corruption. Not reachable: no SseEmitter or SSE endpoints.
    expired_at: 2027-01-18
